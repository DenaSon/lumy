name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Prepare Laravel runtime directories
        run: mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Normalize npm lockfile registry
        run: |
          sed -i 's#https://package-mirror.liara.ir/artifactory/api/npm/npm/#https://registry.npmjs.org/#g' package-lock.json
          sed -i 's#https://package-mirror.liara.ir/repository/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Persist normalized lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/lumy-bootstrap-cleanup'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: normalize npm registry in lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run checks
        run: composer ci:check
