name: Dependency Refresh

on:
  push:
    branches:
      - chore/runtime-dependency-upgrades

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ ! contains(github.event.head_commit.message, '[skip refresh]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.10.3
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Upgrade npm
        run: npm install --global npm@12.0.2

      - name: Prepare Laravel runtime directories
        run: mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache

      - name: Refresh Composer dependencies
        run: composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Refresh npm dependencies
        run: npm install

      - name: Audit dependencies
        run: |
          composer audit
          npm audit --audit-level=moderate

      - name: Build frontend
        run: npm run build

      - name: Run checks
        run: composer ci:check

      - name: Commit refreshed lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
          else
            git commit -m "chore: refresh dependency locks [skip refresh]"
            git push
          fi
