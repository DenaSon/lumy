name: Dependency Refresh

on:
  push:
    branches:
      - chore/runtime-dependency-upgrades

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.10.3
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Upgrade npm
        run: npm install --global npm@12.0.2

      - name: Install current dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Collect dependency reports
        run: |
          node --version > runtime-report.txt
          npm --version >> runtime-report.txt
          composer --version >> runtime-report.txt
          npm outdated --json > npm-outdated.json || true
          npm audit --json > npm-audit.json || true
          composer outdated --direct --format=json > composer-outdated.json || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: |
            runtime-report.txt
            npm-outdated.json
            npm-audit.json
            composer-outdated.json
